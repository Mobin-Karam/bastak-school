name: Feature request
description: Propose new or changed product/engineering behavior
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / goal
      description: What user or engineering problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints / context
      description: Compatibility, security, performance, migration, UI, API, or rollout constraints.
  - type: textarea
    id: authorization_scope
    attributes:
      label: Access and scope
      description: Which capabilities, organizations, users, and data boundaries apply? Use N/A only when no protected data or action is involved.
