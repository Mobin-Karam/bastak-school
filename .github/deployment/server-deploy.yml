name: Server production deployment
on:
  repository_dispatch:
    types: [verified-main]
permissions:
  contents: read
concurrency:
  group: bastak-production
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.verify.outputs.current }}
    steps:
      - name: Verify source CI and current main
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.client_payload.sha }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          source=Mobin-Karam/bastak-school
          run=$(gh api "repos/$source/actions/runs/$RUN_ID")
          printf '%s' "$run" | python3 -c 'import json,os,sys; r=json.load(sys.stdin); assert r["event"]=="push" and r["head_branch"]=="main" and r["head_sha"]==os.environ["RELEASE_SHA"] and r["status"]=="completed" and r["conclusion"]=="success" and r["path"]==".github/workflows/continuous-integration.yml" and r["head_repository"]["full_name"]=="Mobin-Karam/bastak-school"'
          current=$(gh api "repos/$source/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$RELEASE_SHA" ]]; then echo 'current=true' >> "$GITHUB_OUTPUT"; fi
  deploy:
    needs: authorize
    if: needs.authorize.outputs.current == 'true' && vars.IMMUTABLE_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, bastak-lan]
    environment: production
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Mobin-Karam/bastak-school
          ref: ${{ github.event.client_payload.sha }}
          persist-credentials: false
      - name: Deploy the tested commit
        env:
          GH_TOKEN: ${{ secrets.SOURCE_ARTIFACT_READ_TOKEN }}
          RELEASE_SHA: ${{ github.event.client_payload.sha }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
          IMMUTABLE_DEPLOY_ENABLED: ${{ vars.IMMUTABLE_DEPLOY_ENABLED }}
          PRODUCTION_CONFIG_DIR: /home/bastak-server/.config/bastak-production
          PRODUCTION_DATA_VOLUME: bastak-school_moshaver_v2_sqlite
          PRODUCTION_BACKUP_DIR: /home/bastak-server/.config/bastak-production/backups
          PRODUCTION_LOCK_FILE: /home/bastak-server/.config/bastak-production/deploy.lock
          PRODUCTION_RECEIPT: /home/bastak-server/.config/bastak-production/release.json
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo 'Configure read-only SOURCE_ARTIFACT_READ_TOKEN in the private production environment.'; exit 1; }
          current=$(gh api repos/Mobin-Karam/bastak-school/git/ref/heads/main --jq .object.sha)
          [[ "$current" == "$RELEASE_SHA" ]] || { echo 'Skipping superseded release.'; exit 0; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          config=/home/bastak-server/.config/bastak-production
          test -d "$config/tls"
          test -f "$config/production.env"
          umask 077
          test -f "$config/nginx.conf.template"
          mkdir -p "$config/releases"
          export RELEASE_BUNDLE
          RELEASE_BUNDLE="$config/releases/$RELEASE_SHA-$RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 tooling/cicd/release_bundle.py download "$RELEASE_BUNDLE" "$RELEASE_SHA" --run-id "$RUN_ID"
          current=$(gh api repos/Mobin-Karam/bastak-school/git/ref/heads/main --jq .object.sha)
          [[ "$current" == "$RELEASE_SHA" ]] || { echo 'Skipping superseded release after download.'; exit 0; }
          ./scripts/deploy/lan-immutable.sh
