name: Backend v2 Quality

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'scripts/deploy/verify-security.sh'
      - 'packages/api-contract/**'
      - 'packages/cmb/**'
      - '.github/workflows/backend-v2-quality.yml'
  push:
    branches: [develop, main]
    paths:
      - 'apps/api/**'
      - 'scripts/deploy/verify-security.sh'
      - 'packages/api-contract/**'
      - 'packages/cmb/**'
      - '.github/workflows/backend-v2-quality.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install reusable package dependencies
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          for dir in packages/cmb/*; do
            test -f "$dir/package.json" || continue
            (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund)
          done
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Apply every migration to a fresh database
        env:
          DATABASE_PATH: ${{ runner.temp }}/moshaver-fresh.sqlite
        run: npm run migration:run
      - name: Verify the authorization matrix against a disposable database
        working-directory: .
        run: ./scripts/deploy/verify-security.sh
