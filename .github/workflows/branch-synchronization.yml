name: Branch synchronization
on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]
    branches: [develop, main]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: branch-synchronization-develop
  cancel-in-progress: false
jobs:
  refresh-open-prs:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update same-repository PRs behind validated develop
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: develop
        shell: bash
        run: ./scripts/cicd/sync-open-pr-branches.sh
  synchronize-main-into-develop:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: lan-production
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN }}
      - name: Create or resume checked main-to-develop synchronization
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: ./scripts/cicd/sync-main-into-develop.sh
