name: Continuous Integration
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm run docs:check
      - run: npm run workspace:check
      - run: npm run workspace:list
      - run: npm run workspace:plan -- build
      - run: npm run bootstrap
      - run: npm run architecture:check
      - run: npm run architecture:self-test
      - run: npm run contracts:check
      - run: npm run cmb:compatibility
      - run: npm run test:generators
      - run: npm run test:cmb-publish
      # Admin Vitest runs once below with coverage enabled; every other Admin
      # verify task and every other project task still runs here.
      - run: npm run verify -- --skip=admin-v2:test
      - run: ./scripts/deploy/verify-security.sh
      - run: npm --prefix apps/admin run audit:parity
      - run: npm --prefix apps/admin run test:coverage
      - run: npm --prefix apps/admin run test:e2e -- --list
      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/admin/package-lock.json') }}
      - name: Install Playwright Chromium and host dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm --prefix apps/admin exec -- playwright install --with-deps chromium
      - name: Confirm cached Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npm --prefix apps/admin exec -- playwright install chromium
      - run: npm --prefix apps/admin run test:e2e -- --grep 'desktop panels remain reachable'
      - run: npm --prefix apps/admin audit --omit=dev --audit-level=high
      - run: npm --prefix apps/api audit --omit=dev --audit-level=high
      - run: python3 -m pip install 'PyYAML==6.0.2'
      - run: python3 -m unittest discover -s tooling/cicd -p 'test_*.py'
  containers:
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    uses: ./.github/workflows/deployment-readiness.yml
  promotion-evidence:
    name: Promotion evidence
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact tested develop candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: ./scripts/cicd/verify-promotion-evidence.sh
  gate:
    name: CI Gate
    if: always()
    needs: [quality, containers, promotion-evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check
        env:
          QUALITY: ${{ needs.quality.result }}
          CONTAINERS: ${{ needs.containers.result }}
          PROMOTION: ${{ needs.promotion-evidence.result }}
        run: |
          if [[ "$PROMOTION" == success ]]; then
            test "$QUALITY" = skipped && test "$CONTAINERS" = skipped
          else
            test "$PROMOTION" = skipped
            test "$QUALITY" = success && test "$CONTAINERS" = success
          fi
