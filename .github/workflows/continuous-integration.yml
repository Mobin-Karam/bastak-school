name: Continuous Integration
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Check promotion direction
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: test "$HEAD_BRANCH" = develop && test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
      - run: npm run docs:check
      - run: npm run workspace:check
      - run: npm run workspace:list
      - run: npm run workspace:plan -- build
      - run: npm run bootstrap
      - run: npm run architecture:check
      - run: npm run architecture:self-test
      - run: npm run contracts:check
      - run: npm run cmb:compatibility
      - run: npm run test:generators
      - run: npm run verify
      - run: ./scripts/deploy/verify-security.sh
      - run: npm --prefix apps/admin run audit:parity
      - run: npm --prefix apps/admin run test:coverage
      - run: npm --prefix apps/admin audit --omit=dev --audit-level=high
      - run: npm --prefix apps/api audit --omit=dev --audit-level=high
      - run: python3 -m pip install 'PyYAML==6.0.2'
      - run: python3 -m unittest discover -s tooling/cicd -p 'test_*.py'
  containers:
    uses: ./.github/workflows/deployment-readiness.yml
  gate:
    name: CI Gate
    if: always()
    needs: [quality, containers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check
        env:
          QUALITY: ${{ needs.quality.result }}
          CONTAINERS: ${{ needs.containers.result }}
        run: test "$QUALITY" = success && test "$CONTAINERS" = success
  sync-main:
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: lan-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN }}
      - name: Keep develop synchronized with release history
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo 'Configure RELEASE_PR_TOKEN.'; exit 1; }
          git fetch origin main develop
          git merge-base --is-ancestor "$RELEASE_SHA" origin/develop && exit 0
          branch="chore/sync-main-$RELEASE_SHA"
          existing=$(gh pr list --repo "$GH_REPO" --base develop --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch" origin/develop
          git merge --no-ff --no-edit "$RELEASE_SHA"
          git push origin "$branch"
          gh pr create --repo "$GH_REPO" --base develop --head "$branch" --title 'chore: synchronize released main into develop' --body "Preserve release ancestry after main CI passed for $RELEASE_SHA. Merge with a merge commit after CI; do not squash this synchronization."
          pr=$(gh pr list --repo "$GH_REPO" --base develop --head "$branch" --state open --json number --jq '.[0].number')
          gh pr merge "$pr" --repo "$GH_REPO" --auto --merge
