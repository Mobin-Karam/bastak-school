name: Continuous Integration
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm run docs:check
      - run: npm run workspace:check
      - run: npm run workspace:list
      - run: npm run workspace:plan -- build
      - run: npm run bootstrap
      - run: npm run architecture:check
      - run: npm run architecture:self-test
      - run: npm run contracts:check
      - run: npm run cmb:compatibility
      - run: npm run test:generators
      - run: npm run test:cmb-publish
      # Admin Vitest runs once below with coverage enabled; every other Admin
      # verify task and every other project task still runs here.
      - run: npm run verify -- --skip=admin-v2:test
      - run: ./scripts/deploy/verify-security.sh
      - run: npm --prefix apps/admin run audit:parity
      - run: npm --prefix apps/admin run test:coverage
      - run: npm --prefix apps/admin run test:e2e -- --list
      - run: npm --prefix apps/admin exec -- playwright install --with-deps chromium
      - run: npm --prefix apps/admin run test:e2e -- --grep 'desktop panels remain reachable'
      - run: npm --prefix apps/admin audit --omit=dev --audit-level=high
      - run: npm --prefix apps/api audit --omit=dev --audit-level=high
      - run: python3 -m pip install 'PyYAML==6.0.2'
      - run: python3 -m unittest discover -s tooling/cicd -p 'test_*.py'
  containers:
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    uses: ./.github/workflows/deployment-readiness.yml
  promotion-evidence:
    name: Promotion evidence
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact tested develop candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: ./scripts/cicd/verify-promotion-evidence.sh
  gate:
    name: CI Gate
    if: always()
    needs: [quality, containers, promotion-evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check
        env:
          QUALITY: ${{ needs.quality.result }}
          CONTAINERS: ${{ needs.containers.result }}
          PROMOTION: ${{ needs.promotion-evidence.result }}
        run: |
          if [[ "$PROMOTION" == success ]]; then
            test "$QUALITY" = skipped && test "$CONTAINERS" = skipped
          else
            test "$PROMOTION" = skipped
            test "$QUALITY" = success && test "$CONTAINERS" = success
          fi
  sync-main:
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: lan-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN }}
      - name: Keep develop synchronized with release history
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo 'Configure RELEASE_PR_TOKEN.'; exit 1; }
          git fetch origin main develop
          git merge-base --is-ancestor "$RELEASE_SHA" origin/develop && exit 0
          branch="chore/sync-main-$RELEASE_SHA"
          existing=$(gh pr list --repo "$GH_REPO" --base develop --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh pr merge "$existing" --repo "$GH_REPO" --auto --merge
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git switch -c "$branch" "origin/$branch"
            git merge --no-ff --no-edit origin/develop
          else
            git switch -c "$branch" origin/develop
          fi
          git merge --no-ff --no-edit "$RELEASE_SHA"
          git push origin "$branch"
          gh pr create --repo "$GH_REPO" --base develop --head "$branch" --title 'chore: synchronize released main into develop' --body "Preserve release ancestry after main CI passed for $RELEASE_SHA. Merge with a merge commit after CI; do not squash this synchronization."
          pr=$(gh pr list --repo "$GH_REPO" --base develop --head "$branch" --state open --json number --jq '.[0].number')
          gh pr merge "$pr" --repo "$GH_REPO" --auto --merge
