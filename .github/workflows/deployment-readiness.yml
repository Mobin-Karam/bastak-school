name: Deployment Readiness
on:
  workflow_call:
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3
      - name: Test exact release images on a disposable HTTPS stack
        env:
          RELEASE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_BUNDLE_PATH: ${{ runner.temp }}/production-images
        run: |
          if [[ "$EVENT_NAME" == push ]]; then
            export CI_RELEASE_BUNDLE="$RELEASE_BUNDLE_PATH"
          fi
          ./scripts/deploy/verify-release.sh
      - name: Retain tested image archive and identity manifest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-images-${{ github.sha }}
          path: |
            ${{ runner.temp }}/production-images/manifest.json
            ${{ runner.temp }}/production-images/images.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
