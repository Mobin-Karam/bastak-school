name: Deployment Readiness
on:
  workflow_call:
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
      - name: Test exact release images on a disposable HTTPS stack
        env:
          RELEASE_SHA: ${{ github.sha }}
          CI_RELEASE_BUNDLE: ${{ runner.temp }}/production-images
        run: ./scripts/deploy/verify-release.sh
      - name: Retain tested image archive and identity manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-images-${{ github.sha }}
          path: |
            ${{ runner.temp }}/production-images/manifest.json
            ${{ runner.temp }}/production-images/images.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
