name: Deployment Readiness

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/admin/**'
      - 'apps/student/**'
      - 'student-core/**'
      - 'packages/**'
      - 'tooling/generators/**'
      - 'docker-compose.yml'
      - 'docker-compose.production.yml'
      - 'deployment/lan/**'
      - 'scripts/deploy/**'
      - 'docker-compose.coolify.yml'
      - '.github/workflows/deployment-readiness.yml'
  push:
    branches: [develop, main]
    paths:
      - 'apps/api/**'
      - 'apps/admin/**'
      - 'apps/student/**'
      - 'student-core/**'
      - 'packages/**'
      - 'tooling/generators/**'
      - 'docker-compose.yml'
      - 'docker-compose.production.yml'
      - 'deployment/lan/**'
      - 'scripts/deploy/**'
      - 'docker-compose.coolify.yml'
      - '.github/workflows/deployment-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable production configuration
        run: |
          ./scripts/deploy/create-lan-tls.sh
          cp deployment/lan/production.env.example .run/production/production.env
      - name: Build production topology
        run: docker compose --env-file .run/production/production.env -f docker-compose.production.yml -f deployment/lan/compose.yml -p bastak-ci build
      - name: Smoke HTTPS, API proxies, database migrations and secure cookies
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file .run/production/production.env -f docker-compose.production.yml -f deployment/lan/compose.yml -p bastak-ci)
          cleanup() {
            status=$?
            if (( status != 0 )); then "${compose[@]}" ps; "${compose[@]}" logs --no-color; fi
            "${compose[@]}" down --volumes --remove-orphans
            exit "$status"
          }
          trap cleanup EXIT
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --wait --wait-timeout 180
          curl --fail --silent --cacert .run/production/tls/ca.crt https://localhost/ready >/dev/null
          curl --fail --silent --cacert .run/production/tls/ca.crt https://localhost/ >/dev/null
          curl --fail --silent --cacert .run/production/tls/ca.crt https://localhost/api/v2/openapi.json >/dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://localhost:8082/)" = 308
          "${compose[@]}" exec -T backend-v2 node -e 'if(process.env.COOKIE_SECURE!=="1"||process.env.NODE_ENV!=="production")process.exit(1)'
