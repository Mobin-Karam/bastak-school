name: Graphify Tooling

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  graphify-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.13.1'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Detect optional committed graph
        id: graph
        shell: bash
        run: |
          if [[ -s graphify-out/graph.json && -s graphify-out/code-fingerprint.json ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [[ -e graphify-out/graph.json || -e graphify-out/code-fingerprint.json ]]; then
            echo 'Graph artifacts are incomplete. Refresh Graphify before committing.' >&2
            exit 1
          else
            echo 'No committed Graphify graph; use source discovery as documented in AGENTS.md.'
          fi
      - name: Install pinned Graphify with MCP support
        if: steps.graph.outputs.available == 'true'
        run: python -m pip install --disable-pip-version-check 'graphifyy[mcp]==0.9.58'
      - name: Reject stale graph
        if: steps.graph.outputs.available == 'true'
        run: node tooling/graphify/fingerprint.mjs --check=graphify-out/code-fingerprint.json
      - name: Smoke-query committed graph
        if: steps.graph.outputs.available == 'true'
        run: graphify query 'repository architecture' --budget 300 --graph graphify-out/graph.json >/dev/null
