name: LAN Production Deployment
on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bastak-production
  cancel-in-progress: false
jobs:
  authorize:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.PRODUCTION_DEPLOY_TARGET == 'lan'
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Skip superseded main releases
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$RELEASE_SHA" ]]; then echo 'current=true' >> "$GITHUB_OUTPUT"; fi
  dispatch:
    needs: authorize
    if: needs.authorize.outputs.current == 'true'
    runs-on: ubuntu-latest
    environment: lan-production
    steps:
      - name: Send verified release to private deployment repository
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo 'Configure DEPLOY_DISPATCH_TOKEN in lan-production.'; exit 1; }
          payload=$(python3 -c 'import json,os; print(json.dumps({"event_type":"verified-main","client_payload":{"sha":os.environ["RELEASE_SHA"],"run_id":os.environ["RUN_ID"]}}))')
          printf '%s' "$payload" | gh api repos/Mobin-Karam/bastak-school-deploy/dispatches --method POST --input -
          echo 'Deployment queued. Verify Server production deployment in bastak-school-deploy; this dispatch is not proof of production health.'
