name: LAN Production Deployment
on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bastak-production
  cancel-in-progress: false
jobs:
  authorize:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.PRODUCTION_DEPLOY_TARGET == 'lan'
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Skip superseded main releases
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$RELEASE_SHA" ]]; then echo 'current=true' >> "$GITHUB_OUTPUT"; fi
  deploy:
    needs: authorize
    if: needs.authorize.outputs.current == 'true'
    runs-on: [self-hosted, linux, x64, bastak-lan]
    environment: lan-production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Deploy the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          PRODUCTION_BACKUP_DIR: /home/bastak-server/.config/bastak-production/backups
          PRODUCTION_LOCK_FILE: /home/bastak-server/.config/bastak-production/deploy.lock
          PRODUCTION_RECEIPT: /home/bastak-server/.config/bastak-production/release.txt
        shell: bash
        run: |
          set -euo pipefail
          current=$(curl --fail --silent --show-error --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | python3 -c 'import sys,json; print(json.load(sys.stdin)["object"]["sha"])')
          [[ "$current" == "$RELEASE_SHA" ]] || { echo 'Skipping superseded release.'; exit 0; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          config=/home/bastak-server/.config/bastak-production
          test -d "$config/tls"
          test -f "$config/production.env"
          mkdir -p .run/production
          if [[ ! -e .run/production/tls ]]; then ln -s "$config/tls" .run/production/tls; fi
          test "$(readlink .run/production/tls)" = "$config/tls"
          install -m 600 "$config/production.env" .run/production/production.env
          ./scripts/deploy/lan.sh
          printf '%s\n' "$RELEASE_SHA" > "$PRODUCTION_RECEIPT"
