name: Student Core Quality

on:
  pull_request:
    branches: [develop]
    paths:
      - 'student-core/**'
      - 'packages/api-contract/**'
      - '.github/workflows/student-core-quality.yml'
  push:
    branches: [develop]
    paths:
      - 'student-core/**'
      - 'packages/api-contract/**'
      - '.github/workflows/student-core-quality.yml'

permissions:
  contents: read

jobs:
  student-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: student-core/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
