name: Student experience quality
on:
  pull_request:
    branches: [develop]
    paths:
      - 'apps/admin/**'
      - 'student-core/**'
      - 'packages/api-contract/**'
      - 'packages/admin-workspace-ui/**'
      - 'tooling/workspace/**'
      - '.github/workflows/student-v2-quality.yml'
  push:
    branches: [develop]
    paths:
      - 'apps/admin/**'
      - 'student-core/**'
      - 'packages/api-contract/**'
      - 'packages/admin-workspace-ui/**'
      - 'tooling/workspace/**'
      - '.github/workflows/student-v2-quality.yml'
permissions:
  contents: read
jobs:
  student-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.3
      - name: Verify the shared Admin Student experience
        run: |
          node tooling/workspace/run.mjs bootstrap --project=admin-v2
          node tooling/workspace/run.mjs verify --project=admin-v2
      - name: Verify runtime-neutral Student core
        run: |
          node tooling/workspace/run.mjs bootstrap --project=student-core
          node tooling/workspace/run.mjs verify --project=student-core
