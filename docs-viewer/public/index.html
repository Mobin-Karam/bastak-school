<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse and search Moshaver repository documentation." />
    <title>Moshaver Documentation</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#document">Skip to document</a>
    <div class="reading-progress" id="readingProgress" aria-hidden="true"></div>
    <div class="app-shell">
      <aside class="library" id="library" aria-label="Documentation library">
        <a class="brand" href="#docs/README.md"><span class="brand-mark" aria-hidden="true">M</span><span><strong>Moshaver</strong><small>Documentation</small></span></a>
        <label class="search-field" for="globalSearch"><span class="sr-only">Search documentation</span><input id="globalSearch" type="search" placeholder="Search documentation…" autocomplete="off" /><kbd>/</kbd></label>
        <p id="searchSummary" class="search-summary">Browse by subject</p>
        <nav id="libraryNav" class="library-nav" aria-label="Documentation sections"></nav>
        <section id="recentSection" class="recent-section hidden" aria-labelledby="recentHeading"><div class="section-heading"><h2 id="recentHeading">Recently read</h2><button id="clearRecent" type="button">Clear</button></div><div id="recentList" class="recent-list"></div></section>
        <footer class="library-footer"><span id="docCount">Loading library…</span><button id="themeToggle" type="button">Dark theme</button></footer>
      </aside>
      <div id="backdrop" class="backdrop" hidden></div>
      <main id="document" class="reader" tabindex="-1">
        <header class="reader-header"><button id="menuButton" class="menu-button" type="button" aria-controls="library" aria-expanded="false">Browse</button><div id="breadcrumbs" class="breadcrumbs" aria-label="Document location"></div><div class="reader-actions"><button id="copyLink" type="button" disabled>Copy link</button><a id="rawDocument" href="#" target="_blank" rel="noreferrer" aria-disabled="true">Raw</a></div></header>
        <div class="reader-layout"><article id="docContent" class="document-content" aria-live="polite"><div class="empty-state"><p class="eyebrow">Documentation library</p><h1>Choose a document</h1><p>Search for a topic or browse a section from the library.</p></div></article><aside id="outline" class="outline hidden" aria-label="On this page"><p>On this page</p><nav id="outlineNav"></nav></aside></div>
        <nav id="pager" class="pager hidden" aria-label="Adjacent documents"></nav>
      </main>
    </div>
    <script src="./vendor/marked.js"></script>
    <script type="module" src="./app/main.js"></script>
  </body>
</html>
