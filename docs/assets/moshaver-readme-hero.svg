<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Moshaver — connected student support workspace</title>
  <desc id="desc">A product-focused Moshaver hero showing student planning, attention items, reports, assessments and chat, plus quick paths to run and contribute.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071f1d"/>
      <stop offset="48%" stop-color="#0b3a35"/>
      <stop offset="100%" stop-color="#0f5d54"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5faf7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#021816" flood-opacity="0.32"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#021816" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1400" height="700" rx="36" fill="url(#bg)"/>
  <circle cx="1288" cy="62" r="235" fill="#2dd4bf" opacity="0.07"/>
  <circle cx="1220" cy="685" r="260" fill="#f59e0b" opacity="0.055"/>
  <circle cx="120" cy="650" r="190" fill="#5eead4" opacity="0.05"/>

  <!-- subtle workflow lines -->
  <g stroke="#99f6e4" stroke-opacity="0.10" fill="none">
    <path d="M36 555 C185 500 260 600 400 545 S690 505 790 555"/>
    <path d="M1040 82 C1160 36 1270 118 1375 62"/>
  </g>

  <!-- left brand -->
  <g transform="translate(74 70)">
    <rect x="0" y="0" width="74" height="74" rx="22" fill="#ecfdf5"/>
    <path d="M19 52V25c0-7 8-10 13-6l5 5 5-5c5-4 13-1 13 6v27" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="37" cy="52" r="5.5" fill="#d97706"/>

    <text x="98" y="34" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="0.6">MOSHAVER</text>
    <text x="100" y="62" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#99f6e4" letter-spacing="2.6">STUDENT SUPPORT · EDUCATION OPERATIONS</text>
  </g>

  <text x="74" y="206" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="760" fill="#ffffff">
    One workspace around every student.
  </text>
  <text x="74" y="248" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#d7f7f0">
    Plan learning, follow progress, run assessments,
  </text>
  <text x="74" y="278" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#d7f7f0">
    communicate, and act on what needs attention.
  </text>

  <!-- who uses it -->
  <g transform="translate(74 326)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="0" font-size="13" font-weight="800" fill="#99f6e4" letter-spacing="2.1">BUILT FOR</text>

    <g transform="translate(0 24)">
      <rect width="132" height="46" rx="14" fill="#ffffff" fill-opacity="0.10" stroke="#99f6e4" stroke-opacity="0.18"/>
      <circle cx="24" cy="23" r="10" fill="#5eead4" fill-opacity="0.24"/>
      <path d="M19 26c1-5 9-5 10 0M24 20a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" stroke="#ccfbf1" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <text x="43" y="29" font-size="14" font-weight="650" fill="#ffffff">Students</text>
    </g>

    <g transform="translate(144 24)">
      <rect width="142" height="46" rx="14" fill="#ffffff" fill-opacity="0.10" stroke="#99f6e4" stroke-opacity="0.18"/>
      <circle cx="24" cy="23" r="10" fill="#fde68a" fill-opacity="0.20"/>
      <path d="M18 25h12M20 19h8M20 31h8" stroke="#fef3c7" stroke-width="1.8" stroke-linecap="round"/>
      <text x="43" y="29" font-size="14" font-weight="650" fill="#ffffff">Counselors</text>
    </g>

    <g transform="translate(298 24)">
      <rect width="140" height="46" rx="14" fill="#ffffff" fill-opacity="0.10" stroke="#99f6e4" stroke-opacity="0.18"/>
      <circle cx="24" cy="23" r="10" fill="#a7f3d0" fill-opacity="0.20"/>
      <path d="M17 27h14M19 21h10M22 16h4" stroke="#d1fae5" stroke-width="1.8" stroke-linecap="round"/>
      <text x="43" y="29" font-size="14" font-weight="650" fill="#ffffff">Education teams</text>
    </g>
  </g>

  <!-- core flow -->
  <g transform="translate(74 426)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="0" font-size="13" font-weight="800" fill="#99f6e4" letter-spacing="2.1">CONNECTED WORKFLOW</text>

    <g transform="translate(0 26)">
      <rect width="87" height="36" rx="12" fill="#ecfdf5"/>
      <text x="43.5" y="23.5" text-anchor="middle" font-size="12.5" font-weight="750" fill="#0f5d54">PLAN</text>
      <path d="M92 18h21m-6-5 6 5-6 5" stroke="#99f6e4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(118 26)">
      <rect width="94" height="36" rx="12" fill="#ecfdf5"/>
      <text x="47" y="23.5" text-anchor="middle" font-size="12.5" font-weight="750" fill="#0f5d54">ASSESS</text>
      <path d="M99 18h21m-6-5 6 5-6 5" stroke="#99f6e4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(243 26)">
      <rect width="96" height="36" rx="12" fill="#ecfdf5"/>
      <text x="48" y="23.5" text-anchor="middle" font-size="12.5" font-weight="750" fill="#0f5d54">REPORT</text>
      <path d="M101 18h21m-6-5 6 5-6 5" stroke="#99f6e4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(370 26)">
      <rect width="82" height="36" rx="12" fill="#ecfdf5"/>
      <text x="41" y="23.5" text-anchor="middle" font-size="12.5" font-weight="750" fill="#0f5d54">CHAT</text>
    </g>
  </g>

  <!-- lower action cards -->
  <g transform="translate(74 552)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="218" height="82" rx="20" fill="#ffffff" fill-opacity="0.10" stroke="#99f6e4" stroke-opacity="0.22"/>
    <circle cx="36" cy="41" r="18" fill="#5eead4" fill-opacity="0.20"/>
    <path d="M28 41h16M36 33v16" stroke="#ccfbf1" stroke-width="2.5" stroke-linecap="round"/>
    <text x="66" y="35" font-size="14" font-weight="800" fill="#ffffff">USE MOSHAVER</text>
    <text x="66" y="56" font-size="12.5" fill="#ccfbf1">Docker Compose → open apps</text>

    <g transform="translate(230 0)">
      <rect width="218" height="82" rx="20" fill="#ffffff" fill-opacity="0.10" stroke="#fef3c7" stroke-opacity="0.22"/>
      <circle cx="36" cy="41" r="18" fill="#fbbf24" fill-opacity="0.18"/>
      <path d="M27 36h18M27 42h12M27 48h15" stroke="#fef3c7" stroke-width="2.3" stroke-linecap="round"/>
      <text x="66" y="35" font-size="14" font-weight="800" fill="#ffffff">CONTRIBUTE</text>
      <text x="66" y="56" font-size="12.5" fill="#fef3c7">Pick an issue → PR → verify</text>
    </g>
  </g>

  <!-- product mockup -->
  <g transform="translate(575 74)" filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect width="753" height="552" rx="28" fill="url(#panel)"/>

    <!-- browser frame -->
    <rect width="753" height="56" rx="28" fill="#edf5f1"/>
    <rect y="28" width="753" height="28" fill="#edf5f1"/>
    <circle cx="26" cy="28" r="5" fill="#f87171"/>
    <circle cx="44" cy="28" r="5" fill="#fbbf24"/>
    <circle cx="62" cy="28" r="5" fill="#34d399"/>
    <rect x="92" y="16" width="286" height="25" rx="10" fill="#ffffff" stroke="#d9e6df"/>
    <text x="111" y="32.5" font-size="11.5" fill="#6b7f77">moshaver · admin / students / sara</text>

    <!-- sidebar -->
    <rect x="0" y="56" width="164" height="496" fill="#0f3f3a"/>
    <g fill="#c8eee5" font-size="12.5">
      <text x="48" y="103" font-weight="700" fill="#ffffff">Moshaver</text>
      <text x="48" y="145">Needs attention</text>
      <text x="48" y="181">Students</text>
      <text x="48" y="217">Planner</text>
      <text x="48" y="253">Assessments</text>
      <text x="48" y="289">Reports</text>
      <text x="48" y="325">Chat</text>
    </g>
    <g stroke="#9de6d7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="26" cy="98" r="9"/>
      <path d="M20 147h12M26 141v12"/>
      <path d="M18 180h16M22 175h8M22 185h8"/>
      <rect x="18" y="208" width="16" height="16" rx="4"/>
      <path d="M21 247l4 4 8-9"/>
      <path d="M19 282h14M22 276v12M27 280v8M32 273v15"/>
      <path d="M18 318h16v10H24l-5 5v-5h-1z"/>
    </g>
    <rect x="12" y="125" width="140" height="40" rx="11" fill="#ffffff" fill-opacity="0.10"/>
    <circle cx="139" cy="145" r="9" fill="#f59e0b"/>
    <text x="139" y="149" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">3</text>

    <!-- content heading -->
    <text x="191" y="101" font-size="12" font-weight="800" fill="#0f766e" letter-spacing="1.4">STUDENT WORKSPACE</text>
    <text x="191" y="130" font-size="25" font-weight="800" fill="#1f312e">Sara Ahmadi</text>
    <text x="191" y="151" font-size="12.5" fill="#71817c">Today · connected view across planning, progress and communication</text>

    <!-- attention card -->
    <g transform="translate(191 177)" filter="url(#softShadow)">
      <rect width="238" height="112" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
      <circle cx="28" cy="27" r="11" fill="#fb923c" fill-opacity="0.18"/>
      <path d="M28 20v9M28 34h.01" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
      <text x="48" y="31" font-size="12.5" font-weight="800" fill="#9a3412">NEEDS ATTENTION</text>
      <text x="18" y="60" font-size="13" font-weight="700" fill="#3f312a">Math plan is falling behind</text>
      <text x="18" y="82" font-size="11.5" fill="#7c665b">2 tasks overdue · exam in 3 days</text>
      <rect x="18" y="91" width="88" height="5" rx="2.5" fill="#fdba74"/>
      <rect x="18" y="91" width="52" height="5" rx="2.5" fill="#ea580c"/>
    </g>

    <!-- progress card -->
    <g transform="translate(445 177)" filter="url(#softShadow)">
      <rect width="282" height="112" rx="18" fill="#ffffff" stroke="#dce8e2"/>
      <text x="18" y="28" font-size="12.5" font-weight="800" fill="#34504a">WEEKLY PROGRESS</text>
      <text x="18" y="61" font-size="28" font-weight="800" fill="#0f766e">78%</text>
      <text x="78" y="61" font-size="11.5" fill="#71817c">plan completed</text>
      <g transform="translate(18 77)">
        <rect width="246" height="9" rx="4.5" fill="#e6f1ed"/>
        <rect width="192" height="9" rx="4.5" fill="url(#accent)"/>
      </g>
      <text x="18" y="103" font-size="10.5" fill="#71817c">Study 9h 20m · 14/18 tasks · +8% vs last week</text>
    </g>

    <!-- planner -->
    <g transform="translate(191 305)">
      <rect width="354" height="205" rx="18" fill="#ffffff" stroke="#dce8e2"/>
      <text x="18" y="28" font-size="12.5" font-weight="800" fill="#34504a">TODAY'S PLAN</text>
      <text x="307" y="28" font-size="11" font-weight="700" fill="#0f766e">Planner →</text>

      <g font-size="10.5" fill="#71817c">
        <text x="18" y="59">16:00</text>
        <text x="18" y="103">17:00</text>
        <text x="18" y="147">18:00</text>
      </g>
      <g stroke="#e7efeb">
        <path d="M61 55h274M61 99h274M61 143h274M61 187h274"/>
      </g>

      <rect x="72" y="42" width="156" height="42" rx="10" fill="#e6fffa" stroke="#99f6e4"/>
      <text x="84" y="60" font-size="11.5" font-weight="750" fill="#0f5d54">Mathematics · Functions</text>
      <text x="84" y="75" font-size="9.8" fill="#5c7771">45 min · 3 tasks</text>

      <rect x="104" y="88" width="198" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="116" y="106" font-size="11.5" font-weight="750" fill="#1d4ed8">Physics · Problem set</text>
      <text x="116" y="121" font-size="9.8" fill="#607187">60 min · assignment</text>

      <rect x="86" y="134" width="128" height="42" rx="10" fill="#fefce8" stroke="#fde68a"/>
      <text x="98" y="152" font-size="11.5" font-weight="750" fill="#a16207">Review mistakes</text>
      <text x="98" y="167" font-size="9.8" fill="#81735a">30 min · exam prep</text>
    </g>

    <!-- chat -->
    <g transform="translate(561 305)">
      <rect width="166" height="205" rx="18" fill="#ffffff" stroke="#dce8e2"/>
      <text x="16" y="28" font-size="12.5" font-weight="800" fill="#34504a">CHAT</text>
      <circle cx="139" cy="24" r="5" fill="#22c55e"/>
      <text x="16" y="52" font-size="10.5" font-weight="700" fill="#71817c">Counselor</text>

      <rect x="15" y="64" width="122" height="43" rx="11" fill="#eef6f2"/>
      <text x="25" y="82" font-size="9.8" fill="#3e5852">I reviewed today's plan.</text>
      <text x="25" y="96" font-size="9.8" fill="#3e5852">Focus on math first.</text>

      <rect x="43" y="117" width="108" height="42" rx="11" fill="#dffaf3"/>
      <text x="55" y="135" font-size="9.8" fill="#0f5d54">Got it — starting now.</text>
      <text x="55" y="149" font-size="9.2" fill="#578078">16:02</text>

      <rect x="15" y="171" width="136" height="22" rx="9" fill="#f5f8f7" stroke="#e1e9e5"/>
      <text x="25" y="186" font-size="9.4" fill="#98a6a1">Message…</text>
    </g>

    <!-- footer tags -->
    <g transform="translate(191 525)" font-size="10.5" font-weight="700">
      <rect width="94" height="22" rx="8" fill="#e6fffa"/>
      <text x="47" y="15" text-anchor="middle" fill="#0f766e">ROLE AWARE</text>
      <rect x="102" width="85" height="22" rx="8" fill="#eff6ff"/>
      <text x="144.5" y="15" text-anchor="middle" fill="#2563eb">REALTIME</text>
      <rect x="195" width="91" height="22" rx="8" fill="#fefce8"/>
      <text x="240.5" y="15" text-anchor="middle" fill="#a16207">OPEN SOURCE</text>
    </g>
  </g>

  <text x="575" y="661" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#b9e9df">
    Admin · Student · API v2 · Web · PWA · Tauri
  </text>
</svg>